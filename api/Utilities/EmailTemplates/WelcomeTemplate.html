<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #eeeeee;
        }

        .header {
            background-color: #0078d4;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        .content {
            padding: 20px;
        }

        .footer {
            font-size: 12px;
            text-align: center;
            color: #777777;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Chào Mừng Thành Viên Mới!</h2>
        </div>
        <div class="content">
            <p>Xin chào <strong>{Username}</strong>,</p>
            <p>Tài khoản của bạn đã được khởi tạo thành công trên hệ thống của chúng tôi.</p>
            <p>Nếu bạn có bất kỳ câu hỏi nào, xin vui lòng phản hồi lại email này.</p>
        </div>
        <div class="footer">
            <p>Đây là email tự động, vui lòng không phản hồi. &copy; 2026 Enterprise System.</p>
        </div>
    </div>
</body>
</html>
