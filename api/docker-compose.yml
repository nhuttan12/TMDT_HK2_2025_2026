version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    restart: unless-stopped
    
    # Chạy với quyền root để tránh lỗi Permission Denied khi ghi vào volume trên Linux/Docker Desktop
    user: root 

    environment:
      - ACCEPT_EULA=Y 
      # Đảm bảo MSSQL_SA_PASSWORD trong .env có ít nhất 8 ký tự, gồm chữ hoa, thường, số và ký tự đặc biệt
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD} 
      - MSSQL_PID=${MSSQL_PID}

    ports:
      - "${MSSQL_PORT}:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - backend

    healthcheck:
      # Sử dụng đúng biến MSSQL_SA_PASSWORD để kiểm tra trạng thái
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-Q", "SELECT 1"]
      interval: 20s # Tăng thời gian chờ vì SQL Server khởi động khá chậm
      timeout: 10s
      retries: 5
      start_period: 30s # Cho phép container có 30 giây để khởi động trước khi bắt đầu kiểm tra

volumes:
  sqlserver_data:

networks:
  backend: